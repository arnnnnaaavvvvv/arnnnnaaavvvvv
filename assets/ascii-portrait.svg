<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" width="100%" height="100%">
  <defs>
    <!-- Top-to-Bottom Progressive Reveal Animation -->
    <clipPath id="reveal-mask">
      <rect x="0" y="0" width="920" height="0">
        <animate 
          attributeName="height" 
          values="0; 660; 660; 0" 
          keyTimes="0; 0.45; 0.92; 1" 
          dur="6.5s" 
          repeatCount="indefinite" 
          calcMode="spline"
          keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1" />
      </rect>
    </clipPath>

    <!-- Scanline & Terminal Glow Filter -->
    <filter id="cyan-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#22D3EE" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .ascii-text {
      font-family: "Courier New", "Fira Code", "JetBrains Mono", monospace;
      font-size: 9.5px;
      line-height: 11.5px;
      letter-spacing: 1.5px;
      fill: #22D3EE;
      white-space: pre;
    }
    .caption-text {
      font-family: "Fira Code", "JetBrains Mono", monospace;
      font-size: 12px;
      fill: #64748B;
      letter-spacing: 2px;
    }
    .terminal-border {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1;
      rx: 8;
    }
  </style>

  <!-- Background Panel -->
  <rect width="920" height="720" class="terminal-border" />

  <!-- Animated ASCII Content Group -->
  <g clip-path="url(#reveal-mask)" filter="url(#cyan-glow)">
    <text x="25" y="35" class="ascii-text">
      <tspan x="25" dy="0">                                                        ......:--=====--:......                                                       </tspan>
      <tspan x="25" dy="11.5">                                                 ..:--=======================-:..                                                     </tspan>
      <tspan x="25" dy="11.5">                                             .---===================================-.                                                 </tspan>
      <tspan x="25" dy="11.5">                                          .-============================================-.                                             </tspan>
      <tspan x="25" dy="11.5">                                        .-================================================-.                                           </tspan>
      <tspan x="25" dy="11.5">                                      .==================+*#%@@@@@@@@%#*+====================.                                         </tspan>
      <tspan x="25" dy="11.5">                                     -================#@@@@@@@@@@@@@@@@@@@@#=================-                                         </tspan>
      <tspan x="25" dy="11.5">                                    -===============%@@@@@@@@@@@@@@@@@@@@@@@@%================-                                        </tspan>
      <tspan x="25" dy="11.5">                                   -===============%@@@@@@@@@@@@@@@@@@@@@@@@@@%================-                                       </tspan>
      <tspan x="25" dy="11.5">                                  :==============#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#===============:                                      </tspan>
      <tspan x="25" dy="11.5">                                  ==============#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#==============:                                      </tspan>
      <tspan x="25" dy="11.5">                                 :==============%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%==============:                                      </tspan>
      <tspan x="25" dy="11.5">                                 :==============*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*==============:                                      </tspan>
      <tspan x="25" dy="11.5">                                 :===============#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#===============:                                      </tspan>
      <tspan x="25" dy="11.5">                                 :================*@@@@@@@@@@@@@@@@@@@@@@@@@@@@*================:                                      </tspan>
      <tspan x="25" dy="11.5">                                  =================+%@@@@@@@@@@@@@@@@@@@@@@@@%+=================:                                      </tspan>
      <tspan x="25" dy="11.5">                                  :==================+#%@@@@@@@@@@@@@@@@%#+=====================:                                      </tspan>
      <tspan x="25" dy="11.5">                                   -====================+*##%%%%%%%##*+========================-                                       </tspan>
      <tspan x="25" dy="11.5">                                    -=========================================================-                                        </tspan>
      <tspan x="25" dy="11.5">                                     -=======================================================-                                         </tspan>
      <tspan x="25" dy="11.5">                                    ::=======================================================::                                        </tspan>
      <tspan x="25" dy="11.5">                                  :*%#+====================================================+#%*:                                      </tspan>
      <tspan x="25" dy="11.5">                                .#@@@@@%*================================================*#@@@@@#.                                     </tspan>
      <tspan x="25" dy="11.5">                              .*@@@@@@@@@@%#+========================================+#%@@@@@@@@@@*.                                   </tspan>
      <tspan x="25" dy="11.5">                             +@@@@@@@@@@@@@@@@%#*+==============================+*#%@@@@@@@@@@@@@@@@+                                  </tspan>
      <tspan x="25" dy="11.5">                           =%@@@@@@@@@@@@@@@@@@@@@@@%##**++========++**##%@@@@@@@@@@@@@@@@@@@@@@@%=                                 </tspan>
      <tspan x="25" dy="11.5">                         -%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-                               </tspan>
      <tspan x="25" dy="11.5">                       -%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-                             </tspan>
      <tspan x="25" dy="11.5">                     :#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#:                           </tspan>
      <tspan x="25" dy="11.5">                   :#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#:                         </tspan>
      <tspan x="25" dy="11.5">                 .*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*.                       </tspan>
      <tspan x="25" dy="11.5">                +@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+                      </tspan>
      <tspan x="25" dy="11.5">              =%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%=                    </tspan>
      <tspan x="25" dy="11.5">            -%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-                  </tspan>
      <tspan x="25" dy="11.5">          :#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#:                </tspan>
      <tspan x="25" dy="11.5">        .*@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*.              </tspan>
      <tspan x="25" dy="11.5">       =@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@=             </tspan>
      <tspan x="25" dy="11.5">     -%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%-           </tspan>
      <tspan x="25" dy="11.5">    #@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#          </tspan>
    </text>
  </g>

  <!-- Monospace Subtitle Caption -->
  <text x="50%" y="695" text-anchor="middle" class="caption-text">arnav.portrait</text>
</svg>
