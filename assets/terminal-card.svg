<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2633"/>
      <stop offset="100%" stop-color="#131923"/>
    </linearGradient>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
  </defs>

  <style>
    .heading-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .sub-greeting {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .cmd-prompt {
      font-family: "SF Mono", Monaco, Menlo, Consolas, "Courier New", monospace;
      font-size: 13.5px;
      font-weight: 700;
      fill: #22D3EE;
    }
    .cmd-text {
      font-family: "SF Mono", Monaco, Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #E2E8F0;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      fill: #CBD5E1;
    }
    .section-label {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      fill: #64748B;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #F1F5F9;
    }
    .term-title {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 11.5px;
      fill: #64748B;
    }
    .pill {
      fill: url(#pill-bg);
      stroke: #334155;
      stroke-width: 1;
      rx: 13;
    }
  </style>

  <!-- Window Container -->
  <rect width="540" height="450" rx="14" fill="url(#term-bg)" stroke="#1E293B" stroke-width="1.5"/>

