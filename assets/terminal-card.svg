<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 440" width="100%" height="100%">
  <defs>
    <!-- Grayscale Gradients matching G1 #262626 -> G6 #d4d4d4 -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
  </defs>

  <style>
    .heading-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 31px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .sub-greeting {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #A1A1A1;
    }
    .cmd-prompt {
      font-family: "SF Mono", Monaco, Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #D4D4D4;
    }
    .cmd-text {
      font-family: "SF Mono", Monaco, Menlo, Consolas, "Courier New", monospace;
      font-size: 12.5px;
      font-weight: 500;
      fill: #BABABA;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #A1A1A1;
    }
    .section-label {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #7F7F7F;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #D4D4D4;
    }
    .term-title {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #7F7F7F;
    }
    .pill {
      fill: url(#pill-bg);
      stroke: #595959;
      stroke-width: 0.9;
      rx: 12;
    }
  </style>

  <!-- Window Container -->
  <rect width="510" height="440" rx="14" fill="url(#term-bg)" stroke="#595959" stroke-width="1"/>

  <!-- Window Header Bar (G1 #262626) -->
